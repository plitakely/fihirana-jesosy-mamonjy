<script>
const CHANTS = [{"title": "1 - MASINA NY LANITRA", "lyrics": "1-Masina ny Lanitra, feno voninahitra\nFa ny ota tsy ho tafiditr'ao;\n'Zay rehetra tonga ao, dia tsy misy pentina\nFa ny ota tsy ho tafiditr'ao.\n\nIsan'andininy\nNy ota tsy ho tafiditr'ao\nAmin'ny andro fitsarana;\nRaha ny fanahinao, misy pentimpentina;\nTsy ho tafiditr'ao ianao.\n\n2-Raha ilaozanao ity, ka irinao ny ho arỳ\nAmin'lay fonenan-tsoa mamiratra;\nDiovy ny toetranao, aoka ho fiainanao Jeso\nFa ny ota tsy ho tafiditr'ao.\n\n3-Mety ho azonao hatao, ny mivelon'amin' ota.\nKa mandà ny fahasoavan-danitra;\nNefa ny ota dia hisakan'eo am-baravarana\nKa tsy ho tafiditr'ao ianao.\n\n4-Raha fikirinao ny ota, mandra-pahafatinao;\nDia ho latsak'ao amin'ny maizina ianao.\nHo very ianao, hamoy fo mba ho valin'ny natao,\nFa ny ota tsy ho tafiditr'ao."}, {"title": "2 - MISY HERY AO AMIN'NY RA", "lyrics": "1-Te-ho afak'ota va ianao?\nMisy hery ao amin'ny ra, ao amin'ny ra;\nSitrakao va ho levonin'ota ?\nMahagaga ny herin'ny ra\n\nIsan'andininy\n\nMisy hery, hery vaovao\nAmin'ny Ran'ny Zanak'Ondry;\nEny, ampy hanadio anao\nIlay ra sarobidy.\n\n2-Te-handositra amin'ny rehaka\nMisy hery ao amin'ny ra, ao amin'ny ra;\nO! avia re fa ho afaka!\nMahagaga ny herin'ny ra.\n\n3-Te-ho fotsy ka hanjopiaka va ianao?\nMisy hery ao amin'ny ra, ao amin'ny ra;\nRanovelona hanadio ny otanao :\nMahagaga ny herin'ny ra.\n\n4-Maminao va hanompo ilay Mpanjakanao?\nMisy hery ao amin'ny ra, ao amin'ny ra;\nHihira fiderana mahafinaritra ianao,\nMahagaga ny herin'ny ra."}, {"title": "3 - NY RAN'NY ZANAK'ONDRY", "lyrics": "1-Moa ny Ran'ny Zanak'Ondry mahadio\nMba noraisinao ahasasa anao\nMoa tokinao ny hasoavany?\nVoasasa ny rany va ianao?\n\nIsan'andininy\n\nNy Ran'ny Zanak'Ondry va?\nDia 'lay ra mahadio ny fanahy,\nNo namotsianao ny fitafianao?\nVoasasan'ny rany va ianao?\n\n2-Ny Mpamonjy va mba eo anilanao ?\nVoasasan'ny rany va ianao?\n'Lay voahombo hatrizay va aminao ?\nVoasasa ny rany va ianao?\n\n3-Rehefa tonga ny Mpampakatra aty,\nMoa hadio ny fitafianao?\nFonenana mamirapiratra arỳ,\nHo anao raha voasasa ianao.\n\n4-Ny lambanao voapentin'ota re\nMba sasao fa hanjopiaka koa\nNy ran'ny Zanak'Ondry mahadio tokoa\nNy fanahy te-hiverin'amin-dRay."}, {"title": "4 - INDRO NY TOMPO JESOSY JEREO", "lyrics": "1-Indro ny Tompo Jesosy, jereo\nTena nihafy tokoa!\nHe! fa nivesatra eso, jereo\nMba hamonjena anao.\n\nIsan'andininy\n\nIndro Jeso, jereo Jeso(in-2)\nIzy izao dia mihevitra anao,\nIndro Jeso, Jereo.\n\n2-Indro ny Tompo Jesosy jereo\nEfa voahombo tokoa !\nHe! fa nijaly tsy meloka teo,\nMba hamonjena anao\n\n3-Indro ny lefo-mandoza jereo\nNenti-namely ny Tompo\nHe! fa ny rany nirotsaka teo\nMba hamonjena anao"}, {"title": "5 - MBA SAINONAO ANGE", "lyrics": "1-Mba sainonao ange,\nSao tsy mba fantatrao ;\nNy zava-dehibe\nNataoko ho anao!\n:;:Hevero, ka lazao, lazao\nIzay mba vitanao:;:\n\n2-Ny lapako tarỳ,\nNy fahefako tao;\nNilaozako tatỳ\nHanavotra aina anao !\n:;:Hevero, ka lazao, lazao\nIzay mba foinao:;:\n\n3-Heveronao ange\nNy nisoloana anao\nNangidy indrindra anie\nNy nahazoana anao\n:;:Hevero, ka lazao, lazao\nIzay mba nentinao:;:\n\n4-Endrey! ny aiko koa\nNomeko ho anao;\nTsy misy zava-tsoa\nTsy foiko ho anao\n:;:Hevero, ka lazao, lazao\nIzay mba taminao:;:\n\n5-Ry Tompo be fitia\nEndre, 'ty vitanao;\nIzaho 'zay mpania;\nTsy mahavaly 'zao!\n:;:Ny aiko no mba raisonao\nHanao ny sitrakao:;:"}, {"title": "6 - HANDALO AHO", "lyrics": "1-Maty voahombo 'Lay Mpanavotra\nZanak' Ondry mora sady Masina\nMba handoa ny trosan' ny mpanota re\nFafazo ny rany ny fanahinao\n\nIsan'andininy\n\nHandalo anao(bis)\nRaha hitako ny ra(bis)\nEny, handalo Aho\nRaha hitako ny ra\n\n2-Ny mpanota indrindra no havotany ;\nNy tenifikasana hotanterahiny\nMisasà amin'ilay Loharano soa\nIzay miboika hanadio ny meloka.\n\n3-Ny olona rehetra ho avy hanatrika\nIlay fitsarana ho tonga faingana\nMba hotolorana ny valin'asany ;\nIlay Ra mahadio no aoka hiafenanao.\n\n4-Endrey ny fangoraham-po sy fitiavany,\nHe tsy misy fetra sy mahatoky koa ;\nRaha te-ho sambatra sy tretrika ianao\nAoka re ny Rany no ho fiarovanao."}, {"title": "7 - JESOSY NO SAINIKO ALOHA", "lyrics": "1- Mpamonjy nanafak'ahy Jesosy;\nNahazoako ny zava-drehetra Izy\nNy fahafatesana noreseny ;\nAtolotr'Azy ny fiderana\n\nIsan'andininy\n\nJesosy no sainiko aloha\nNy maraina vao mifoha ;\nJesosy indray no sainiko\nAmin'ny alina koa.\n\n2-Ry Mpanasitran'ô ampio aho\nHo salama sy ho matanjaka;\nAsehoy ny herinao, ry Tsitoha,\nEo amin'ny fanompoako Anao.\n\n3-Jesosy ô aok'ho tehirizinao\nHaharitra ny finoako Anao\nAry ao anatin'ny adim-panahy,\nTariho sy tohano handresy aho.\n\n4-Mpanjaka mbola ho avy indray;\nHanjak'amim-boninahitr'Izy;\nKoa amin'ny fifalian-dehibe\nNo mbola hihaonako aminy re."}, {"title": "8 - MIJERE NY ZANAK'ONDRY", "lyrics": "1-Irinao ve ho afak'ota anio?\nJereo ny Zanak'Ondry.\nIzy no maty tao Kalvary\nHo Mpanavotra anao.\n\nIsan'andininy\n\nMijere ny Zanak'Ondry!\nMijere ny Zanak'Ondry!\nIzy irery ihany no mahavonjy anao\nMijere ny Zanak'Ondry!\n\n2-Raha alaim-panahy ka azon-tahotra,\nJereo ny Zanak' Ondry.\nNy heriny no hampandresy anao,\nJereo ny Zanak'Ondry.\n\n3-Trotraka va fa toa lavi-dalana?\nJereo ny Zanak'Ondry.\nNy Fitiavany no hampahery anao\nHampifaly ny fonao.\n\n4-Raha semban' aloka eny an-dalana\nJereo ny Zanak'Ondry.\nNa ory na finaritra ety\nJesosy aminao."}, {"title": "9 - MAKANESA ATY AMIKO", "lyrics": "1-Henoy ny Mpamonjy 'zay miantso hoe:\nMankanesa atỳ, ry mavesatr'entana,\n'Zay mijaly sy miasa fatratra,\nIzaho hanome ny fitsaharana.\n\nIsan'andininy\n\nMankanesa atỳ,\nAmiko ianareo\nIzaho no hanome\nNy fitsaharana\nMora sady tsara\nNy Fanahiko;\nMatokia fa maivana\nNy ziogako.\n\n2-Kivy va ianao mivezivezy koa\nSa misalasala, feno ahiahy?\nMisy ady mafy ao anatinao?\nIzy hanome ny fitsaharana.\n\n3-Tafitohin'ota sy henatra ianao\nNoho ny fahotana manorotoro anao?\nNy Mpiandry tsara mampionona\nIzy hanome ny fitsaharana.\n\n4-Resy matetika va ianao?\nNoho ny halemena mampalahelo anao?\nAo Jesosy hanamasina anao,\nNy Fanahiny no fitsaharana."}, {"title": "10 - O ! ry mpanota, aza mandà", "lyrics": "1-O! ry mpanota, aza mandà\nJeso miantso ka miovà,\nMba manantòna Azy izao!\nIzy hamonjy anao.\n\nIsan'andininy\n\nHe! mivoha izao ny lanitra,\nRy mpirenireny lavitra,\nIndro Jesosy, Izy no ao!\nAiza no hisy anao?\n\n2-Be ahiahy va ianao\nNo tsy mandroso faingana izao?\nDia tapaho ny hevitrao,\nKa miovà hatrizao.\n\n3-Mba miverena re, hatrizao,\nKa hararaoty ny andronao,\nFa ny aty ho simba sy lao,\nKa mba modia izao."}, {"title": "11 - HANONTANY ANGAMBA IANAO", "lyrics": "1-Hanontany angamba ianao\nka hiteny hoe:\nInona no antony mampifalifaly anao?\n'Zao no havaliko 'zay\nraha tinao ho fantatra\nOlo-melok'aho nefa nafahan'i Jeso.\n\nIsan'andininy\n\nMisy tany soa arỳ,\nFiomanako ny etỳ;\nAndriamanitra Tompo,\nTsy menatra ny ho Andriamanitro,\n\n2-Hihevitr' angamba ianao\nka hilaza hoe:\nTsy mba misy ady ve\neo amin'ny fiainanao?\nTsy laviko fa misy fahoriana hitako\nNefa Jesosy dia miara-\nmandeha amiko.\n\n3-Matahotr'angamba ianao,\nhoe ho lavo aho?\nKa hiverin-dalana\nnoho ny fahavalo\nTsy misy anefa mety maharombaka\nIzay eo an-tanan'i Jesosy mahery.\n\n4-Hisain'ahy angamba ianao\nka hanao hoe:\nSambatra ianao fa niangaran'\nAndriamanitra\nDiso anefa raha izay,\nFa fitiavana ny ray\nTiany koa ianao\nfa manaova fo vaovao ."}, {"title": "12 - HATRIZAY NAHAZOAKA AN'I JESO", "lyrics": "1-Fanavaozan'izay mahagaga tokoa,\nHatrizay nahazoako an'i Jeso;\nHitako ny mazava niriako elabe\nHatrizay nahazoako an'i Jeso.\n\nIsan'andininy\n\nHatrizay nahazoako an'i Jeso,\nHatrizay nahazoako an' i Jeso,\nNy hafalian'ny foko dia feno tokoa\nHatrizay nahazoako an'i Jeso.\n\n2-Tsy mba maniasia intsony aho re,\nHatrizay nahazoako an'i Jeso,\nVoasasa avokoa ny otako be,\nHatrizay nahazoako an'i Jeso.\n\n3-Ny finoako izao mafy orina koa,\nHatrizay nahazoako an'i Jeso;\nNy rahona mainty misava avokoa,\nHatrizay nahazoako an' i Jeso.\n\n4-Tsy ahoako ny fahafatesana etỳ,\nHatrizay nahazoako an 'i Jeso;\nIndro tazako ny vavahady erỳ\nHatrizay nahazoako an' i Jeso.\n\n5-Fantatro fa honenako io tanana io,\nHatrizay nahazoako an' i Jeso;\nAry faly tokoa aho mandroso ho ao,\nHatrizay nahazoako an' i Jeso."}, {"title": "13 - FITIAVANA RANOVELONA", "lyrics": "1- Fitiavana ranovelona\nLoharano lalina,\nKa miafina ao anatiny\nNy fiainan-danitra.\n\n2-Fitiavana no nirahina\nAvy tamin-Jehovah,\nO ! Mba raiso, dia ho fantatrao\nNy fahasambarana.\n\n3-Fitiavana didy tokana,\nAry didy lehibe;\nMitoera ao, hitoeranao\nAmim-piadanana."}, {"title": "14 - NANDO ANAO ELA AHO RAINO O !", "lyrics": "1-Nandao anao ela aho Raiko ô!\n'Zao dia te-hody aho;\nManiry hiankina eo an-tratranao,\n'Zao dia te-hody aho.\n\nIsan'andininy\n\n:;:'Nty tamy aho,\nRaiko malala ô\nRaiso ny tanako:;:\n\n2-Itambesaran'ny ota natao,\n'Zao dia te-hody aho;\nMatoky anefa fa ho raisonao,\n'Zao dia te-hody aho.\n\n3-Na dia tsy mendrika ho zanakao,\n'Zao dia te-hody aho;\nAtaovy ho isan'ny mpanomponao\n'Zao dia te-hody aho\n\n4-Maniry hanana fiadanam-po,\nZao dia te-hody aho;\nSy mba hivesatra ny zioganao,\n'Zao dia te-hody aho.\n\n5-Indro fa tazako ny sandrinao,\n'Zao dia te-hody aho;\nMitsotra mba hisakambina re!\n'Zao dia te-hody aho."}, {"title": "15 - MIHAMAMIKO ISAN'ANDRO", "lyrics": "1-Manakaiky Anao isan'andro ny foko,\nFotsy noho ny lisy sy mamirapiratra\nSary tsara indrindra tamin'ireo nofiko,\nMihamamy isan'andro amiko Ianao Jeso.\n\nIsan'andininy\n\nEndrey ny hatsarany!\nEndrey ny voninahiny!\nRaha misy mamiko indrindra\nDia Ianao Jeso.\n\n2-Ny voninahitrao Jesosy tonga amiko,\nRaha nahita Anao avy eny lavitra aho;\nFiadanam-po sy fifaliana azoko;\nMihamamy isan'andro amiko Ianao Jeso.\n\n3-Raha mavesatra ny foko amaivaninao;\nAmpofoinao aho raha azon'ny manjo;\nTiako Ianao mivesatra ny entako,\nMihamamy isan'andro amiko Ianao Jeso."}, {"title": "16 - MIHOBY NY FANAHINO", "lyrics": "1-Mihoby ny fanahiko\nFa voavonjy izao;\nNy ratran'ny Mpamonjiko\nNo misy aim-baovao.\n\nIsan'andininy\n\nNy ran'i Jesosy\nNo tena avotro!\nKa sambatra aho\nNo tretrika am-po.\n\n2-Ny ratran'ny Mpamonjinao,\nRy foko, mba jereo,\nFa hanasitrana anao,\nKa ho fiainanao.\n\n3-Mba mibitaha re, ry fo!\nNy gadra tapaka,\nNy hajambana izay nanjo\nIzao dia afaka."}, {"title": "17 - RANON' AINA", "lyrics": "1-Ranon'aina zay tena mateza\nAo an-tampon'i Kalvary;\nSaro-dalana sady mideza,\nNefa kosa tsy lavitr' anao.\n\nIsan'andininy\n\nRanon'aina tsara loatra\nMora hazon'ny maniry azy re\nTsy mba eto fa any ankoatra\n'Zay tafiditr'ao dia tretrika tokoa.\n\n2-Loharano tsy mety ho ritra\nFa maharitra mandrakizay;\nManadio ny loto rehetra\nIkambanana amin' ny Ray.\n\n3-Ny fitiavan'i Jesosy Tompo,\nNo manolotra io rano io,\nKa manafaka ny mampisento;\nHatak'andro, tapaho ny hevitrao.\n\n4-Tonga Jeso hamonjy ny maro\nIzay mibebaka dia matokia;\nNy Fanahy Masin'ny Tompo\nManadio ny loto ao am-po.\n\n5-Ireo Jiosy manao ranolava\nMba hanototra io rano io\nNefa kosa tsy maintsy misava,\nNy fiboikany tsara tokoa."}, {"title": "18 - NY LISY AO AN-DOHASAHA", "lyrics": "1-Nahita sakaiza aho\n'zay nahatanterak'ahy.\nIzy no tsara indrindra\namin' ny alinalina 'Haleloia'\nDia Jesosy nanadio,\nnisolo ahy koa\nNampahery sady nampionona ahy\nNitondra ny entako sy ny aretiko,\nManafaka ny fahasahiranako 'Haleloia'\nKintana mamiratra\nvao maraina Izy io,\nNotsongaiko tamin'ny alinalina.\n\n2-Ny enta-mavesatra\ndia nesoriny tamiko,\nMandako amin'ny fakampanahy Izy\n'Haleloia'\nNy sampin' ny foko efa nilaozako\nNoho ny fitiavako an'i Jeso.\nNa mandao ahy aza\nizao tontolo izao,\nHo tafita aho noho ny herin'i Jeso.\n'Haleloia'\nKintana mamiratra\nvao maraina Izy io,\nNotsongaiko tamin'ny alinalina.\n\n3-Tsy hamela ahy irery\nna handao ahy Izy,\nRaha velona am-pinoana koa aho\n'Haleloia'\nManda vy fiarovan'ahy\ntsy hanan-tahotra aho;\nMana iveloman'ny fanahiko.\nFo matoky no ho entiko\nany an-danitra.\nLoharanom-pifaliana azoko.\n'Haleloia'\nKintana mamiratra\nvao maraina Izy io,\nNotsongaiko tamin'ny alinalina."}, {"title": "19 - RAHA HOMBAN'NY ELATRAO", "lyrics": "1-Raha Ianao no aronay ry Jesosy,\nTsy hanan-tahotra re izahay,\nFa ao ambanin' ny helatrao, misy\nFiadanana soa mandrakizay.\n\nIsan'andininy\n\nRaha homban' ny helatrao\nMatoky sy mahery;\nFa Ianao, ry Tompo Mpanao\nHamonjy tsy ho very.\n\n2-Ny alina maizim-pito mandoza.\nTsy hampaninona ny zanakao;\nFa Ianao no masoandro mazava\nHamirapiratra soa hatrao.\n\n3-Raha manafiotra ny rivo-mahery\nKa misafoaka handentika anay.\nJesosy fitarik'andro hijery\nNy hitodian'ny sambokelinay.\n\n4-Ny fahoriana sakaizan'ny tany;\nNamana, havana mety hamoy;\nFa raha Ianao, no tonga hiandany,\nMahazo toky izahay tsy hikoy.\n\n5-Ry ela-tsoa mahery mpambomba,\nEnto izahay hiaraka aminao;\nFa raha Ianao 'zay Sakaiza no momba\nNy tany hanjary lani-baovao.\n\n6-Jeso, Anao tokoa ny dera aman-daza,\nSy Anao Ray ary Fanahy koa;\nIray ka telo, na dia tokana aza,\nMasina, Masina, tokoa tokoa."}, {"title": "20 - TIAKO IANAO MPAMONJIKO", "lyrics": "1-Tiako Ianao Mpamonjiko,\nFa ahy tontolo.\nHariako ny ditrako,\nHe tiako Ianao Jeso.\n\nIsan'andininy\n\nIanao Mpanavotra ahy\nMpamindra fo tokoa.\nIanao ry Mpamonjiko,\nNo mamin'ny foko.\n\n2-Nitia ahy taloha Ianao\nNamela heloka.\nNy satro-tsilo nentinao\nHe tiako Ianao Jeso.\n\n3-Raha mbola velon'aina koa\nNa maty aza aho.\nDia hankalaza Anao tokoa.\nHe tiako Ianao Jeso.\n\n4-Hitory voninahitra\nSy hankalaza aho.\nHidera anao mandrakizay.\nHe tiako Ianao Jeso."}, {"title": "21 - MAMY NY FOKO, RY JESO O !", "lyrics": "1-Mamin'ny foko, ry Jeso ô!\nNy famonjena 'zay vitanao,\nNy hadisoako navelanao,\nTena afaka aho mandrakizay\n\nIsan'andininy\n\nJeso malala ô! Mpamonjy soa!\nIndro ny aiko raiso ho Anao;\nVelon-kanompo, velon-kanoa,\nVonon-kanao 'zay sitrakao.\n\n2-Tano ny foko ry Jeso tia!\nZaza tsy mahasaraka Anao;\nMbola malemy, mora mania,\nTano hifikitra ao Aminao.\n\n3-Aoka ny foko sy ny fonao\nHiara-mitempo, tena iray;\nAoka ny saiko sy ny sainao\nHiray safidy mandrakizay."}, {"title": "22 - ANAO AHO, TOMPO Ô!", "lyrics": "1-Anao aho Tompo ô! reko ny feonao\n'zay mitory ny fitiavanao ahy;\nNefa mila hatsangan'ny finoana aho\nHanantonako Anao.\n\nIsan'andininy\n\nTompo ô! ataovy manakaiky Anao\nSy ny hazofijalianao aho,\nManakaiky izany lanivoanao,\nMivoa-dra ka isaorako.\n\n2-Hafaliana manao ahoana\n'zany ora iray\nManatrika ny seza fiandriananao;\nRaha mandohalika hivavaka aho\nTompo ô!\nHiresak' Aminao Sakaizako.\n\n3-Atokàny ny fiainako\nhanao ny asanao\nAmin'ny hery sy ny fahasoavanao;\nDia tohano ny fanahiko\nhibanjina amin-toky,\nKa izay sitrakao ho sitrako.\n\n4-Misy fitiavan-dalina\ntsy takatry ny saiko\nMandra-pitako 'lay ony maizina.\nMisy fifaliana tsy hananako\nmandra-podiko\nAmim-piadanana eo Aminao."}, {"title": "23 - AHY JESO", "lyrics": "Ahy Jeso, ahy Izy,\nTompo Mpamonjy soa;\nNitady ahy, namonjy ahy,\nNahafa-po ahy Izy.\nTiako, hankalazaiko\nIanao Mpanjakako;\nApetrako Aminao ny fiainako\nMandra-piantsonao ahy."}, {"title": "24 - ILAZAO JESOSY", "lyrics": "1-Mavesatr'entana va ny fonao?\nIlazao Jesosy, ilazao Jesosy,\nMalahelo va fa lasa ny hafaliana?\nIlazao Jesosinao.\n\nIsan'andininy\n\nIlazao Jesosy, ilazao Jesosy,\nSakaiza tsara ho anao;\nRahalahy tokana an-tany.\nIlazao Jesosinao.\n\n2-Kontsan-dranomaso va ny endrikao?\nIlazao Jesosy, ilazao Jesosy,\nMisy ota miafin' ao am-ponao?\nIlazao Jesosinao.\n\n3-Atahoranao va ny rahon'alahelo?\nIlazao Jesosy, ilazao Jesosy,\nManahy ny ho avy va ianao?\nIlazao Jesosinao.\n\n4-Matahotra ny ho faty va ianao?\nIlazao Jesosy, ilazao Jesosy,\nItomanianao ny fanjakan'i Kristy.\nIlazao Jesosinao."}, {"title": "25 - AZA MANADINO AHY", "lyrics": "1-Aza manadino ahy,\nRy Mpihaino vavaka!\nAza mba manary ahy\nHanalavitra Anao;\nMitodiha, ry Mpanjaka!\nKa jereo ny olonao;\nAza manadino ahy ,\nRy Mpihaino vavaka!\n\n2-Ianao no fiereko,\nVatolampy heriko;\nNa kamboty aza aho,\nFaly manana Anao;\nAfa-tahotra ny foko,\nRaha miandrandra Anao;\nAza manadino ahy,\nRy Mpihaino vavaka.!\n\n3-Eny, Hianao no Raiko,\nKa antsoiko izao;\nNefa ny fahadalako\nAza mba heverinao;\nO! ampifalio aho,\nKa ombay ny elatrao;\nAza manadino ahy,\nRy Mpihaino vavaka!\n\n4-Tabataba lalan-dava\nNo mba hitako izao,\nKa izaho te-ho tonga\nAo ampitsaharanao;\nMitenena, ry Jehovah!\nMamalia ahy izao;\nAza manadino ahy,\nRy Mpihaino vavaka.!"}, {"title": "26 - JESO SAKAIZANAY; JESO ANAY", "lyrics": "1-Jeso Sakaizanay; Jeso anay;\nSady tsy mahafoy, Jeso anay;\nRaha ny olona,\nMety mandao anay;\nJeso no tsy mandao, Jeso anay.\n\n2-Jeso Sakaizanay; Jeso anay;\nIzy no Avotray, Jeso anay;\nMaty ny Tomponay noho ny helokay,\nAfaka izahay, Jeso anay.\n\n3-Jeso Sakaizanay; Jeso anay;\nIzy no Aronay, Jeso anay;\nReraka izahay noho ny adinay,\nJeso no herinay, Jeso anay.\n\n4-Jeso Sakaizanay; Jeso anay;\nIzy no Lalanay, Jeso anay;\nLalana marina hahatongavanay,\nAny an-danitra, Jeso anay.\n\n5-Jeso Sakaizanay; Jeso anay;\nManana izahay, Jeso anay;\nJeso Sakaizanay, no hovantaninay;\nAny an-danitra; Jeso anay."}, {"title": "27 - RY JESO MPAMPONJY MALALA !", "lyrics": "1- Ry Jeso Mpamonjy malala!\nIndreto ny mpanomponao,\nRaha misy izay mankahala,\nMatoky fa manana Anao.:;:Jereo, jereo!\nFa vonon-kanaraka Anao:;:\n\n2- Ny tafika ataon'i Satana\nMilofo hamotraka anay;\nAvia, ry Jeso! mitantàna.\nFa mioman-kandresy izahay.\n:;:Jereo, jereo!\nFa vonon-kanaraka Anao:;:\n\n3- Na zovy mioman-kandrafy\nIrinay hanaraka Anao;\nNa iza hisakana mafy,\nHijoro, fa manana Anao.\n:;:Jereo, jereo!\nFa vonon-kanaraka Anao:;:\n\n4- Ireo nentinao voatantara\nNo feo mampahery anay;\nNy tokin' ireo Maritiora,\nFaneva mitarika anay.\n:;:Jereo, jereo!\nFa vonon-kanaraka Anao:;:"}, {"title": "28 - INDRISY RE, NIVOA-DRA", "lyrics": "1- Indrisy re nivoa-dra\nSy maty ny Tompo!\nMoa tokony hisolo ahy\nIzay kankana?\n\nIsan'andininy\n\n'Lay hazofijaliana nahitako mazava,\nAfak'entana izao ny foko;\nTeo no nampahiratra ahy\ntamim-pinoana.\nIzao aho faly mandavanandro.\n\n2-Moa ho an'ny heloko\nNo nijalianao?\nFamindram-po toa inona!\nFitiavan-dehibe."}, {"title": "29 - NAHOANA AHO NO MIHIRA", "lyrics": "1- Lalina ao am-poko re,\nMisy fifaliana be;\nSatria voavonjy aho;\nNodioviny ny otako.\n\nIsan'andininy\n\nNahoana aho no mihira\nNy amin'iJesosiko;\nSatria Izy no Mpamonjy\nIzay nanafak'ahy.\n\n2- Ampy ahy ny fijeriny\nSy ireo fahatsarany;\nNy nijereko Azy koa,\nNanafaka ny fanahy.\n\n3-Tsar' indrindr' amiko Izy;\nToy ny raozy amiko;\nFa manodidina ahy,\nIreo famindrampony."}, {"title": "30 - NY HAZO NIJALIANAO", "lyrics": "1- Ny hazo nijalianao\nRy Jesosy Tomponay!\nManeho ny fitiavanao,\nDia iankinanay.\n\n2- Mitazana ny masonay,\nMangoraka ny fo;\nNa meloka aza izahay,\nNy teninao ho tò.\n\n3- Ny avotr'aina vitanao\nNo itokianay;\nNy entanay voaesotrao,\nKa afaka izahay.\n\n4-Ny hazo nihomboanao\nDia voninahitray\nNy nanalam-baraka Anao\nNo isandratanay."}, {"title": "31 - REKO NY ANTSON'NY MPAMONJIKO", "lyrics": "1-Reko ny antson'ny Mpamonjiko.\nReko ny antson'ny Mpamonjiko.\n«Ento ny hazofijaliana,\nKa avia hanaraka Ahy»\n\n2-Izay hitarihany ahy\nDia hanaraka Azy aho.\nN'aiza lalana hitondrany,\nHo any koa, ho any aho.\n\n3-Ho any Getsemane aho,\nHiaraka amin'ny Mpamonjiko.\nN'aiza n'aiza hitondrany,\nHo any koa, ho any aho.\n\n4-N'aiza n'aiza fitsarana,\nHiarak'Aminy koa aho\nN'aiza n'aiza hitondrany,\nHo any koa, ho any aho.\n\n5-Hanome fahasoavana ahy,\nHanome voninahitra Izy;\nHomba ahy lalan-dava,\nHomba ahy mandrakizay."}, {"title": "32 - ATOLOTRO NY TENAKO", "lyrics": "1-'Nty ny tenako atolotro\nAnao manontolo,\nRy Jesosy mba ho velona\nhanao ny asanao.\n\nIsan'andininy\n\n'Nty ny tenako, ry Mpamonjiko,\nHo Anao manontolo,\nRaisonao ka hanjakao.\n\n2- Tiako sy itokiako Ianao Jesosy;\nMandohalika eo an-tongotrao\naho Tompo ô.\n\n3-Aoka ho feno ny Fanahy Masina\naho, Mpamonjy ô\nKa ho tsapako fa tena ahy\nIanao Jeso."}, {"title": "33 - RY JESOSY MBA TANTANO", "lyrics": "1-Ry Jesosy mba tantano\nHo tafita soa arỳ,\nKa ambeno sy sakano\n'Zay rehetra loza atỳ\nRano be mangeniheny\n'Zao alehako izao,\nKa aoka Ianao hiteny\nMba ho tokiko hatrao.\n\n2-Aza miandry ao am-pita\nSao dia fefika aho atỳ\nFa avia hiara-mita,\nDia ho tody soa arỳ.\nRaha sendra ka manonja\n'Zany alon-drano be,\nAoka Ianao ho tonga\nHampitony ahy re\n\n3-Ao ny rivotra mahery\nMety hampivadi-po,\nFa ny feonao irery\nMampisava ny manjo.\nAny koa ny vatolampy,\nSy ny biby maro be\nFa ny herinao dia ampy,\nKa vonjeo ny zanakao.\n\n4-Ry Jesosy mihainoa,\n'Zao fivavako izao,\nMijoroa, misehoa,\nKa jereo ny diako 'zao;\nMbola lavitra ao am-pita\nKa tsy hita izay hanjo,\nToy 'lay tao Genesareta,\nMisehoa Ianao.!"}, {"title": "34 - ENDREY NY FITAHIANA", "lyrics": "1-Endrey ny fitahiana\nSy ny hery feno faherezan-danitra\n'Zay ataoko sy alehako;\nNy tanany mahery no mitarika ahy.\n\nIsan'andininy\n\nMitantana, mitantana ny diako\nNy tanany no hitarihany ahy re;\nKa dia hanaraka ny diany amin- toky aho,\nFa ny tanany mahery no mitantana ahy.\n\n2-Indraindray tarihiny\nAmin-dalam-pahafatesana\nny fiainako\nNa ranomasin'onja be,\nTsy hatahotra aho\nFa eo an-tanan'i Jeso.\n\n3-Mpamonjy ô, raisonao ny tanako\nHanekeko an-tsitrapo\nzay tena sitrakao\nN'aiza n'aiza no haleha,\nFaly aho miara-dia,\nFa ny Tananao mahery\nno mitarik'ahy.\n\n4- Ka rehefa vita ny asako ety\nNoho ny fitia sy ny fahasoavanao\nDia handresy aho ka tsy hatahotra\nHiampita ny onim-pahafatesana."}, {"title": "35 - HO HITAKO JESO !", "lyrics": "He! fantatro anie(in-2)\nHe! fantatro fa ho itako Jeso.\nAzo antoka tokoa(in-2)\nAzo antoka fa ho itako Jeso.\nNa alina, na atoandro, na maraina\nTsy haharitra!\nHe! fantatro fa ho itako Jeso."}, {"title": "36 - RAHA AMIKO JESOSY DIA VONONA AHO RE", "lyrics": "1-Na ao an-dohasaha\nfeno loza miafina,\nNa toeran-tsoa,\nfeno fiadanana\nIzao no hany fantatro,\nna andro na alina;\nRaha amiko Jesosy,\ndia vonona aho re.\n\nIsan'andininy\n\nRaha Jesosy no amiko,\nvonona aho re\nFa lanitra ho ahy izay misy ahy,\nRaha amiko Jeso.\nTombon-tsoa ho ahy ny hazofijaliana.\nRaha Jesosy no amiko,\ndia vonona aho re.\n\n2-Angamba anjarako\nHitondra tenim-piainana\nAny amin-tany hay\nmisy ady mahamay.\nHitondra ny fanevan'\nny Filazantsara\nRaha amiko Jesosy,\ndia vonona aho re.\n\n3-Raha hazofijaliana\nanjarako ao an-tranoko,\nNy hafa hitory teny\nam-pitan-dranomasina.\nHasehoko ny finoako,\nekeko ny fitsarany.\nRaha amiko Jesosy,\ndia vonona aho re.\n\n4-Tsy anjarako ny manontany\nny fitsaran'ny Ray,\nNy ahy dia ny manaraka ny teniny.\nNa hitoetra, na handeha,\nna aiza no haleha,\nFaly aho miara-dia\namin'ny Mpamonjiko."}, {"title": "37 - NY MIARA-DIA AMIN'I JESOSY NO TIAKO", "lyrics": "1-Ny miara-dia amin'i Jesosy no tiako\nToa ireo vahoaka maro tamin'ny androny tetỳ\nNoafahany ny babo sy ny malahelo am-po.\nIlay vaovao mahafaly dia mitondra fiadanana.\n\nIsan'andininy\n\nIzay itarihany ahy dia harahiko,\nIzay harosony dia hohaniko,\nNy nalehany no hizorako.\nJeso no harahiko amin'ny androko.\n\n2-Ny miara-dia amin'i Jesosy no tiako\nToa 'lay jamba teo amoron-dalamben'i Jeriko.\nNitaraina izy ka nampahiratiny.\nKa ny lalan'i Jesosy no narahiny.\n\n3-Ny miara-dia amin'i Jesosy no tiako\nHahita an'i Kalvary izay nijaliany.\nNampirotsa-dranomaso ahy ny fitiavany,\nKoa hanarak'Azy aho fa voavela heloka.\n\n4-Indray andro any aho hiaraka amin'i Jeso.\nHo any amin'ilay fonenana hodiako rahatrizay;\nHihira fiderana miaraka amin'ireo masina,\nHankalaza ny Mpamonjy amim-boninahitra."}, {"title": "38 - FANDRESENA", "lyrics": "1-Haleloia! famonjena feno nentin'i Jeso.\nManome fandresena.\nResy teo ny herin'ny ota noho ny fahasoavany.\nFandresena(bis).\n\nIsan'andininy\n\nFandresena(bis)\nHaleloia, afak'aho\nJeso nampandresy ahy\nVoninahitra, haleloia\nHo anao, Haleloia!\n\n2-Itokiako ny Tompo ijoroako ny Teniny.\nFandresena(bis)\nFaly sy miadan'aho, afany ny otako\nFandresena(bis).\n\n3-Ambarao ny fandresenao fiadanana ho doria\nFandresena(bis)\nKa hirao eo imason'ny fahavalonao ny hoe:\nFandresena(bis)\n\n4-Hiraintsika any am-pitan'ity tany 'zay mandalo\nFandresena(bis)\nAtomboy ilay hiranao mandrakizay, ry voavonjy\nFandresena(bis)."}, {"title": "39 - FOFONAINA", "lyrics": ":;:Omeo ahy Tompo ô,\nNy fofon'ainao.\nArotsahy ny Fanahy Masinao:;:\nFenoy ny Herinao aho\nmba ho velona.\nMamenoa ny foko re anio."}, {"title": "40 - MANANA LATABATRA", "lyrics": "1-Manana latabatra\nvoaomana Jeso\nHamahanany ireo olo-masina.\nNy voafidy no antsoiny\nhiaraka mihinana:\nNy fanahy 'zay reraka\ndia ho afa-po.\n\nIsan'andininy\n\nO! Avia ka mihinana\nfa miandry anao Jeso.\nNy latabatry ny Tompo\nazonao ihinanana;\n'Lay namoky marobe\nnanova rano ho divay,\nMiantso ny noana\nhiara-komana Aminy.\n\n2-Ho avy faingana handray\nny fofom-badin'i Jeso,\nHo eo anilany mandrakizay doria;\nIreo maro any an-danitra\nho avy hanatrika\nNy fampakarambadin'i Kristy Jeso.\n\n3-Fivorian-dehibe\nsy feno voninahitra,\nHo fotsy manjopiaka ireo masina.\nHiara-paly sy hihoby sy hiaraka manjaka\nAmin'i Kristy Tompo mandrakizay."}, {"title": "41 - REHEFA ANTSOINA NY ANARANA", "lyrics": "1-Rehefa tonga ny maraina\nFeno hazavana be,\nKa maneno ny trompetran-danitra.\nMiangona erỳ am-pita\nny voavonjy marobe;\nHo any koa, ho any koa aho re!\n\nIsan'andininy\n\nRehefa antsoina ny anarana(in-3),\nHo any koa, ho any koa aho re!\n\n2-Rehefa atsangana ny maty\nAo amin'ny Tompo soa,\nKa mandray anjaram-boninahitra\nRehefa antsoina ny voafidy\nho arỳ ankoatra arỳ;\nHo any koa, ho any koa aho re!\n\n3-Na maraina na hariva\nmiasà ho an'i Jeso;\nDerao fa mahagaga ny fitiavany,\nRehefa tapitra ny fiainantsika\nsy ny asa etỳ;\nHo any koa, ho any koa aho re!"}, {"title": "42 - MIJORO AHO", "lyrics": "1-Tenin'i Kristy no ianteherako\nAzo antoka sy tsy mivadika.\nRaha tonga ny ahiahy\nsy ny tahotra.\nIo no vato ianteherako.\n\nIsan'andininy\n\nMijoro aho!(bis)\nMijoro amin'ny tenin'i\nKristy Jesosy.\nMijoro aho!(bis)\nMijoro amim-pahatokiana.\n\n2-Ny tenin'i Kristy no ianteherako\nAfaka avokoa izao ny otako.\nFa efa voavidin'ny rà soan'i Jeso;\nNy fahafahany no tanako.\n\n3-Tenin'i Kristy no ianteherako,\nMamehy ahy ny tadim-pitiavana;\nIsan'andro aho hifaly sy handresy,\nNoho ny sabatry ny fanahy.\n\n4-Ny Tenin'i Kristy no ianteherako\nNoho izany dia tsy hatahotra aho;\nHenoiko isan'andro koa\nny feon'ny Fanahy,\nKa mahita fitsaharana aho."}, {"title": "43 - NY TSARA INDRINDRA", "lyrics": "1-Henoy ny antson'ny\nTompoko ho anao:\n«Atolory Ahy ny tsara\nindrindra aminao»\nNa be na kely izay vitanao tetỳ,\nIzy no hitsara ny fiezahanao.\n\nIsan'andininy\n\nJesosy dia mitahy ny asany\nNy tsara indrindra no tadiaviny.\nNa bitika aza re ny talentanao,\nNy tsara indrindra no omeo Azy.\n\n2-Tsy ilàna sitraka amin'olombelona\nFa voninahitr' Andriamanitra.\nAza ketraka amin'ny fanaovan-tsoa,\nHo azonao tokoa ny valisoa.\n\n3-Mandalo ny andro; avy faingana ny alina.\nHampamoahina any an-danitra ny asanao\nDia ho azonao ny tena fitsaharana,\nNoho ny tsara indrindra 'zay natolotrao."}, {"title": "44 - HAZAVAO NY TOERANA IZAY MISY ANAO", "lyrics": "1-Aza miandry mandra-pahavitanao\nzava-dehibe,\nAoka hipariaka ny taratrao.\nBe ny andraikitrao manodidina anao\nHazavao ny toerana izay misy anao;\n\nIsan'andininy\n\nHazavao ny toerana izay misy anao,\n'Reo miraparapa anaty haizina;\nAmpio izy hahita fitodiana;\nHazavao ny toerana izay misy anao.\n\n2-Misy eo ankaikinao ve\nitambesaran-drahona;\nAza avela ho takona ny taratrao,\nNa dia fo iray monja no hifaly noho ianao\nHazavao ny toerana izay misy anao.\n\n3-Rehefa mety ho talenta izay\nnomen'ny Tompo anao;\nDia ilaina ho fitarik'andro soa.\nIreo noana dia ho voky mofon'\naina an-tananao,\nHazavao ny toerana izay misy anao."}, {"title": "45 - AOKA HO HITA AMINAO JESOSY", "lyrics": "1-Vahiny an-tanin' ota ianao:\nAoka ho tarafin'ny hafa,\nAtaovy madio sy masina\nIvelany sy atiny.\n\nIsan'andininy\n\nAoka ho hita aminao Jesosy.\nAoka ho hita aminao Jesosy.\nLazao isan'andro ny hasoavany;\nAoka ho hita aminao Jesosy.\n\n2-Ny fiainanao dia boky 'zay\nVakin'izao tontolo izao;\nManondro lalan-danitra.\nAoka ho hita aminao Jesosy.\n\n3-Raha tapitra ny andronao\nHo feno fifaliana ianao.\nHahita ireo voataonanao,\nAn-dapa soa honenanao.\n\n4-Aoka hiaina amin'i Kristy\nAndro aman'alina ianao;\nHitarika amin'ny fiainana;\nHanazava ireo very."}, {"title": "46 - RY MIARAMILA ! MANDROSOA IZAO", "lyrics": "1-Ry miaramila! mandrosoa izao,\nKristy Kapiteny mialoha anao;\nAo aloha tafika, loza, ratra be,\nFitsaharana tsy misy, misikina re\n\nIsan'andininy\n\nRy miaramila! mandrosoa izao.\nKristy Kapiteny mialoha anao.\n\n2-Any lehy ratsy no manotrika\nAny ny tsipika no milatsaka;\nTano ny finoana ho ampinganao,\nEntonao ho fandresena\nizao rehetra izao:\n\n3-Aza miamboho na miherika,\nAo an-tratranao ny fiarovana;\nAza mba matahotra,\nfa sahia fandrao\nRaha tsy mandresy\ndia resy ianao:\n\n4-Dia mandrosoa ianao izao,\nKa miraisa dia aminay ho ao;\nMilofosa fatratra fa aza ketraka,\n«Miadia ny aditsaran'ny finoana»:\n\n5-Kristy Kapiteny tapitr'ohatra\nIzy no Mpiaro ny mpanafika;\nMiankina Aminy mafy ianao\nK'aza mba ny tenanao no itokianao:"}, {"title": "47 - IRAHO AHO !", "lyrics": "1-Mba henoy ny Tompo, miantso anao:\n«Iza no handeha hiasa anio;\nIza no hitondra ho Ahy ireo very\nSy hitarika amin-dalan-tery.»\n\nIsan'andininy\n\nMitenena Tompo ô!\nDia hamaly Anao faingana aho.\nMitenena Tompo ô!\nKa hiraho aho mba hamory.\n\n2-Raha afo mahamay mandoro,\nManadio ny mpaminany izany;\nIza no handeha, hoy ny Tompo!\nDia namaly izy:Iraho aho.\n\n3-Alinalina ireo matin'ota:\nHenonao va ny tomaniny?\nMba faingàvna re, avia afaho\nDia valio ny Tompo hoe:\n«Inty aho»\n\n4-Hifarana ny taom-pijinjana\nKa hangonina ny vokatra.\nNy Tompony hanampy sy handray\nIreo mazoto, miasa tsara."}, {"title": "48 - IZA NO HAHASARAK' AHY", "lyrics": "1-Iza no hahasarak'ahy\nAminao, ry Jeso ô!\nTompo tia nanavotr'ahy.\nIanao, ry Kristy ô!\n\nIsan'andininy\n\nKa loza ve sa mosary,\nSa fanenjehana mafy;\nNa ny fahafatesana aza eny, eny\nTsy hamoizako Anao.\n\n2-Iza no hahasarak'ahy\nAmin'ny fitiavanao;\nHe ny foko tsy manahy;\nTafatoetra eo aminao.\n\n3-Ny finoana no ampinga\nNy Baiboly sabatra,\nKa manoatra ny mpandresy\nAmin'ny alalanao.\n\n4-Ry Jesosy feno hery,\nTano aho ho Anao;\nRy Mpamonjy manan-kery,\nVonona aho hanoa Anao."}, {"title": "49 - IZA NO HANOMPO AN'I JESO SOA", "lyrics": "1-Iza no hanompo an'i Jeso soa?\nIza no hanaiky mba ho Azy moa?\nHe ny hatsarany! he ny antra be!\nFa Izy ta-hamonjy, ka meteza re.\n\nIsan'andininy\n\nJeso,Tomponay o!\n'Ndreto izahay,\nAvy mba hanaiky,\nka mandraisa anay.\n\n2-Iza re no mety, iza re lazao,\nHanome ny fony mba ho Azy 'zao?\nHe! miantso mafy Jeso Tompo tia:\n'Zay rehetra mety, ô! Avia, avia!\n\n3-Iza no mba sahy, sahy ao am-po\nHo miaramila fehin'i Jeso?\nIza no hiady, ady tsara re?\nFa ny fahavalo dia maro be.\n\n4-Iza re no homba Azy ankehitrio\nMba hamonjy ireny azon'ny manjo?\nIza no hihafy sady hanome\nAndro, hery, saina! mamalia e!\n\n5-Iza no hazoto mba hiasa moa?\nIza no handroso mba ho hendry koa?\nIza no hanaiky iza re? lazao,\nMba ho an'i Jeso 'zao anio izao:"}, {"title": "50 - O MANDROSOA RY MPANARATON'I JESO", "lyrics": "1-O! mandrosoa ry mpanaraton'i Jeso.\nIzay no baiko azontsika, ka mandrosoa.\nJesosy Tompo no mibaiko,\nmandrosoa.\nRaiso ka arotsahy ny haratonao.\n\nIsan'andininy\n\nMiaingà, ry namako ô!\nJeso no mibaiko.\nMandrosoa, mandrosoa,\nMandrosoa tokoa.\nAza kivy koa, na dia tsy mahazo\nMandrosoa amin'ny lalina tokoa.\n\n2-O! mandrosoa ry mpanaraton'i Jeso.\nSaina mora kivy, aoka ho lavinao,\nFa ny mora kivy, dia hanenina tokoa.\nRaiso ka arotsahy ny aratonao.\n\n3-O! mandrosoa ry mpanaraton'i Jeso\nMbola ao ny hazandrano ho azonao\nTsy azonao anio, ampitso mandrosoa.\nRaiso ka arotsahy ny aratonao.\n\n4- Mba mitoera Jeso ao antsambonay,\nMba ho renay lalandava ny feonao\nNy baikonao ry Tompo, no handrasanay,\nHandrotsahanay ny haratonay."}, {"title": "51 - HAFATRA NY AMIN'NY FIAVIANY", "lyrics": "1-Miandry izao isika,\nho avy indray ny Tompo,\nHo etỳ an-tany handray ireo Azy;\nKoa mivonòna rehefa re ny antso,\nHiara-manjaka amin'i Jeso.\n\nIsan'andininy\n\nFaly isika milaza ny fiaviany\nizay isaorana,\nHo avy faingana am-boninahitra\nIzy hilaza hoe:\nMifohaza, ry masin'ny Tompo\nNahoana ianao no matory?\nMivonòna amin'ny antsony farany.\n\n2-Miandrandra isika sady manantena\nVoninahitra ho an' izay mpandresy;\nFiainana mandrakizay\nizao no miandry\nHo an'ireo mandà ny ota.\n\n3-Mivavaka isika hiavian'ny Tompo,\n'Zay mampanantena fiainana\nmandrakizay;\nHo avy faingana Izy, ho to izay lazainy,\nIsika hifanatrika Aminy.\n\n4-'Zao no famantarana, ho avy faingana Izy;\nNy firenen-drehetra nandre ny teniny;\nTazano ny aviavy: efa manaroka Izy;\nHita izao fa akaiky ny farany."}, {"title": "664 - LEHIBE NY FAMINDRAMPONAO", "lyrics": "1 Lehibe tokoa ny famindraponao\nRy Andriamanitra Raiko ô !\nTsy miova Ianao sy ny antranao\nTsy misy aloky ny fihodinana\n\nIsan’ andininy\n\nFa lehibe tokoa\nNy famindramponao\nVaovao isa-maraina amiko\nNomen’ ny tananao izay nilaiko\nFamindrampo lehibe amiko !\n\n2 Ireo fizaran-taona izay maharitra,\nIzao rehetra izao sy ny lanitra,\nDia vavolombelona manambara\nFa lehibe ny famindramponao .\n\n3 Famelan-keloka, fiadanana,\nNy fanatrehanao hitantana,\nHery anio sy toky ampitso :\nFitahianao ho ahy mandrakizay."}, {"title": "665 - FOHAZY INDRAY IZAHAY", "lyrics": "1 Derainay Ianao, Ray ô !\nFa Jesosy, Zanakao izay maty\nNitsangana indray.\n\n\t\tIsan’ andininy\n\nHaleloia, dera ho Anao,\nHaleloia, Amena !\nHaleloia, deraho Anao !\nFohazy indray izahay.\n\n2 Derainay Ianao !\nNoho ny Fanahinao,\nMpanazava naneho anay ny Tompo\n\n3 Dera sy haja\nHo an’ny Zanak’ ondry\nVoavono, nitondra ireo otanay\n\n4 Fohazy indray izahay,\nFenoy fitiavana \nIreo fanahy rehetra, hirehitra indray."}, {"title": "666 - MITSANGANA HO AN'I JESOSY", "lyrics": "1 Mitsangàna ianao ho an’i Jesosy\nRy miaramilan’ny hazofijaliana\nAsandrato ho avo ilay fanevany\nHo tazana eran-tany,\nTsy hilofika tokoa .\nHo fandresena hatrany ;\nIreao tafika hombany ;\nMandra-pandresy fahavalo ;\nHanjaka Kristy izay Tomponao.\n\n2 Mitangàna ianao ho an’i Jesosy !\nNy feon’ny trompetra miantso anao hanoa ;\nHiatrika ny ady lehiben’ny Tsitoha.\nAndrony iray izany, be voninahitra ;\nRy olony rehetra,\nHerezo ka sahia ;\nHtrehinao ireo ady,\nTohero ireo fahvalonao.\n\n3 Mitsangàna ianao ho an’i Jesosy\nHianteheronao ny heriny irery ;\nFadio ny sandry nofo, ny matoky tena\nTafio ny fiadian’ny Filazantsara,\nIreo fiadinao,\nEnto amim-bavaka avokoa ;\nKa aza mandà ireo antso,\nAoka ho vonona hatrany ianao.\n\n4 Mitangàna ianao ho an’i Jesosy\nMandalo anie ny ady, aoka ho mahatoky.\nNy feon’akoran’ady hody fihobiana ;\nFa izay mandresy no satroham-boninahitra\nHiara-manjaka Aminy,\nHandova ny fianinana,\nHo mandrakizay doria Amena."}, {"title": "734 - NY HO TOA ANAO, TOMPO O!", "lyrics": "1-Ny ho toa Anao, ry Mpamonjiko,\nNo hany faniriako tokoa\nNafoiko izay harena tety,\nHitady Anao ry Tompoko,\n\nIsan'andininy \n\nNy ho toa Anao, eny toa Anao,\nRy Tompo o, fa Masina Ianao\nMidìna amin'ny fahafenoanao,\nTombohy amin'ny kasenao.\n\n2-Ny ho toa Anao, malemy fanahy\nMamela heloka, be fitia\nTia ny kamboty, tohan'ny lavo,\nNitady ny mpanota mania.\n\n3-Ny ho toa Anao, tsy misy tsiny,\nMasina, be fahari-po tokoa\nMahazaka ireo mpanakiana,\nMiaritra mba hanao ny soa.\n\n4-Ny ho toa Anao re ry Tompo o!\nInty aho, omeo ny hosotrao\nNy momba ahy sy mety ho ahy\nDia indro atolotro Anao.\n\n5-Ny ho toa Anao, miangavy re Aho\nFenoy ny Fanahy Masina\nHo tempoly sy fonenanao,\nHanana toerana ao an-danitra ao."}, {"title": "738 - MBA TADIAVO IHANY AHO", "lyrics": "1-Rehefa tonga any an-danitra ianao\nIzay nanana ny Tompo\nKa avy niarahaba ireo malalanao\nManodidina ny Tompo.\n\nIsan'andininy :\n\nKoa mba tadiavo ihany Aho\nFa ao ilay sakaizanao\nKa hifanatrika isika\nDerao ilay Jesosy.\n\n2-Rehefa nizaha ireo tanàna tao ianao\nNahita ireo harena soa \nNakarina an-danitra mamiratra\nSondriana tamin'ireo koa.\n\n3-Raha nandre ny hobin'ireo maro ianao\nMihira ho an'i Jesosy\nArahim-peon'harpa volamena\nMidera hoe: \"Haleloia\".\n\n4-Rehefa hitsaoka ianao manoloana\nNy Mpanjakan'ny mpanjaka\nKa hahita Ilay Mpamonjy izay nitondra \nHiravo hibanjina Azy."}, {"title": "761 - TSY ILAIKO HO FANTATRA", "lyrics": "1-Tonga ny andro sy alina ka aizi-mangina\nMampitondra ratra na fitoniana\nInjay ilay feo malefaka ao am-po\nManao hoe : ''Aza manota\nIndro Aho, Jesosy re!\"\n\nIsan'andininy \n\nTsy ilaiko fantatra afa-tsy ny mamahatra\nAmin'ny Tanany izay ampy ho ahy\nOmeny vahaolana aho na andro na alina\nKa ny Tanany no hamikirako.\n\n2-Toa ranomasina mahery ny fiainana \nManonja hatrany am-pon'ny olona\nMampametra-panontaniana ao am-po\n''Aoka tsy hanahy'' fa ao ny Tompo.\n\n3-Rehefa tapitra ny fiainako ety.\nKa mby amin'ny lapa volamena ary\nEo, dia hitodika, hisaina ilay lalako\nTsy ilaiko fantatra intsony izany."}, {"title": "811 - RY ANJELIN'NY LANITRA", "lyrics": "1-Ry anjelin’ny lanitra,\nMihira ny fiandohana\nHe mba nidina ianareo tety !\nO ! Derao ilay Mesia\n\nIsan’andininy :\n\nAvia miankohofa Aminy,\nManompoa an’i Kristy\n\n2-Ry mpiandry ondry an-tsaha\nMandava ny alina\nEfa tonga ety izao ilay Krsisty,\nIzay fahazavana.\n\n3-Ry Magy, aza variana\nAmin’ilay kintany, \nIo ilay Irin’ny firenena\nMba ho fandresena\n\n4-Ianareo olo-masina\nMiandry, manantena\nAvy tampoka an-tempoly Izy\nKristy fanekena."}, {"title": "812 - ILAY MPANAVOTRA ANTSIKA", "lyrics": "1-Mpanavotra antsika , \nKristy Zanaky ny Avo,\nMameno ahy ny fiadananao,\nRy Zanak’ Ondry madio\n\nIsan’andininy :\n\nMisaotra Anao izahay ry Ray\nIzay nanome ny Zanakao\nNitondra fanazavana tamin’ny Fanahy\n\n2-Mpanavotra antsika \nIlay maty voahombo,\nHenika ny fahasoavanao,\nIlay natsangan’ ny Tompo.\n\n3-Indray andro any,\nDia hifanatri-tava,\nHo velona eo anoloanao,\nFeno fahasoavana."}, {"title": "813 - MISY SAKAIZA HO AN'NY ANKIZY", "lyrics": "1-Misy Sakaiza iray ho antsika ankizy,\nIzay tsy manam-paharoa be fitiavana Izy,\nTsy toy ireo olona ety izay miovaova,\nFa sakaiza mendrika Izy tsy manana ota.\n\n2-Misy lapa hafa kely ho antsika ankizy,\nFeno fiadanana io, manjaka ao Jesosy,\nTsy fampitaha amin'izay tanànantsika,\nKa ireo tonga any hifaliavanja.\n\n3-Hisatro-boninahitra ianareo izay tonga any,\nIzay rehetra voavonjy no homena izany,\nDiadema manjelatra, nekeny ho anao,\nValisoa manokana noho ireo asanao."}, {"title": "814 - KANTO NOHO ILAY MARAINA", "lyrics": "1-Kanto noho ny maraina soa,\nIanao ry Mpamonjiko !\nEndrey izany hatsaranao !\nSatriko hidera Anao.\n\nIsan'andininy :\n\nKanto noho ilay maraina soa\nSy mamiratra noho ny andro,\nEndrey ! Ny fanatrehanao\nNy aizina resy tao.\n\n2-Mitafy hazavana be,\nMisatroka mpanjaka,\nIlay tehim-panapahana.\nTsy hanam-pahataperana.\n\n3-Lehibe ilay indrafonao,\nSy n fahasoavanao,\nNy fitiavanao mamiko,\nO! Mandrosoa amiko.\n\n4-Rehefa tapaka ilay kofehy,\nVolafotsy ka hiainga aho,\nMiaraka amin'ireo marobe\nHidera Azy an-danitra ao."}, {"title": "815 - JESOSY MORA FO, MPAMPINDRA FO", "lyrics": "1-Ry Jesosy mora fo,\nMba vonjeo re izahay ! \nAmin'ny fahatsoram-po, \nTena vonona handray.\n\n2-Iriko ho toa Anao,\nOmeo ahy fo vaovao,\nIanao mpamondra fo,\nTaomy re! Aho hadio fo."}, {"title": "816 - LEVONA TAO KALVARY IZANY", "lyrics": "1-Tsara lavitraa sady miavaka\nIlay hafatra tonga tao am-poko,\nNentin'i Jesosy tao ireo otako\nKa levona tao Kalvary.\n\nIsan'andininy :\n\nKa levona tao Kalvary \nNy lasako sy ny asaany\nIreo heloko nentin'ny Tompo tao,\nKa indro levona sy lao.\n\n2-Ireo dian-kapoka sy satro-tsilo,\nDia maneho ahy ny fitiavany,\nMenatra, niondrika aho,\nNiantso ny anarany, \nSeho tao Kalvary.\n\n3-Tsy nisy toa azy ilay indrafony,\nVoavotra aho raha teo an-tongony,\nFamonjena feno ilay noraisiko,\nTao Kalvary izay mamiko."}, {"title": "817 - EFA NITSANGANA KRISTY", "lyrics": "1-Efa nitsangana Kristy ka,\nIndro maraim-baovao,\nNisokatra ny fasana ka,\nFandresena be no tao.\n\nIsan'andininy :\n\nHaleloia! Nitsangana!\nO! Fandresena feno,\nTsy nahatazona Azy ny lo,\nVoakodia ilay vato.\n\n2-Efa nitsangana Kristy ka\nFoan ny tomany,\nMbola maizim-be no niseho ilay\nTompoko Jesosy \n\n3-Efa nitsangana Kristy \nIndro velona Izy,\nMpanjakan'ny voninahitra sady\nFiloha ambony."}, {"title": "818 - FANAHY MASINA TOMPO ANDRIAMANITRA", "lyrics": "1-Fanahy Masina o!\nIndro ny ora izao\nToy ilay Andro Pentekosta\nMba midìna Ianao.\n\n2-Am-piraisan-tsaina,\nIray toerana\nMiandry, manantena Anao,\nIzahay ry Fanahy\n\n3-Dia manandrandra Anao koa,\nFahendrena feno\nOmeo fo miredareda,\nHo feno vavaka."}, {"title": "819 - IREO VOKATRY NY FANAHY", "lyrics": "1-Fahasoavam-be mendrika ho antsika, \nFitiavana lehibe sy lalina\nFifaliana ao amin'ny Tompontsika\nMamy sy tony ilay fiadanana.\n\n2-Omeo fahari-po noho ireo fihantsiana\nNy ratra valio fahamoram-panahy\nIreo jembin'ady, omeo fahatsarana \nRehefa sasatra, zarao finoana.\n\n3-Fahalemem-panahy sy fanetren-tena\nFahononam-po, izay fehezinao\nAtolotray ireo asa irakao,\nNotontosananay teo imasonao."}, {"title": "820 - JEHOVAH NO MPIANDRY AHY", "lyrics": "1-Jehovah no Mpiandry ahy\nTsy hanan-java mahory aho,\nMampandry ahy amin'ny \nAhi-maintso Izy\n\n2-Jehovah no Mpiandry ahy \nTsy hanan-java mahory aho,\nMitondra eo amoron'ny rano tony\nManarina ahy Izy.\n\n3-Jehovah no Mpiandry ahy \nTsy hanan-java mahory aho \nMitarika amin'ny lalana marina \nNoho ny Anarany."}, {"title": "821 - DINIHO AHO ANDRIAMANITRO", "lyrics": "1-Diniho aho Andriamanitro,\nIzahao toetra aho, fantaro ny fo,\nSedrao aho amin'iteo Teninao,\nInoako sy fanantenako ianao.\n\n2-Diniho aho, reseo ny filako\nMiboiboika ilay fitiavako,\nAfeno ao ambany elatrao,\nNy fiainako hialoka ao Aminao.\n\n3-Diniho aho noho ny loton'ny ota\nFotsip toy ny volamena voadio,\nFantaro koa ny eritreritro,\nIreo hevi-diso, diovy aho Tompo.\n\n4-Diniho aho ka ny finoako,\nMba ho fitaratra ireo asako,\nMandra-piantso ahy, eny hifoha aho\nDia horaisinao am-pifaliana aho."}, {"title": "822 - JESOSY NO MPANAMORIKO", "lyrics": "1-Misosa tsara ao anaty ranobe\nNy sambokeliko marefo\nNy rivo-mahery tsy ahatahorako\nJesosy ny mpanamoriko\n\nIsan'andininy :\n\nJesosy Mpanmonjy,\nMpanamoriko Izy\nEny hatoky Azy aho\nFa vita ny ady tao\n\n2-Onja mitopatopa, rano lalina.\nNy Mpanamoriko malina,\nHifikirako ireo teny matotra\nNy ranobe tsy hanafotra \n\n3-Iry ilay fiantsonana, vita ny dia\nIreo ady levona ho doria,\nHo faly aho ahita ireo malalako,\nNy mandrakizay, anjarako."}, {"title": "823 - RY KRISTIANA O! MITANDREMA IANAO", "lyrics": "1-Ry Kristiana o! Mitandrema ianao,\nManompoa amin-tahotra ianao,\nFandrina sy fakam-panahy izao\nNo hitaona sy hampanota anao,\nRy Kristiana o! Mitandrema ianao izao,\nMandindona ny loza hanjo anao.\n\n2-Ry Kristiana o! Mahereza ianao,\nTafiotra sy haizim-pito no ao,\nTsy ho ela dia hisinda ireo\nFa ny Tomponao no ho avy eo\nRy Kristiana o! Mahereza ianao izao,\nMamaky tokoa ny tafiotra.\n\n3-Ry Kristiana o! Mitozoa, mivavaha\nAntsoy Izy fandrao hadinonao,\nHo voaaro anaty ady ianao, \nRaha tafionao ireo fiadianao,\nRy Kristiana o! Aza hatsahatrao ny vavaka\nIzay fanaonao, handresy ianao.\n\n4-Ry Kristiana o! Manantenà ianao,\nNy alahelo, hatsaharo izao\nFeon'ilay mpitsara no hananako :\n\"Midira amin'ny fifalian'ny Tompo\" \nRy Kristiana o! Manantenà ianao izao,\nHo anao ilay fitsaharana ao."}, {"title": "824 - REHEFA TAO BETANIA IZY", "lyrics": "1-He! Fitiavana ny fo mafana\nRehefa tao Betania Izy,\nMahaliana ilay Teny Fiainana\nRehefa tao Betania Izy \nFiadanana sy fitoniana,\nRehefa tao Betania Izy \nNihoby Salamo ireo mino fo\nRehefa tao Betania Izy \n\nIsan'andininy :\n\nIndro hasambaram-be toy ilay fahiny\nRehefa tao Betania Izy,\nDia vohao hidanadana ny ao,\nTsy piova ny fitiavany,\nDia avelao hiditra,\nSokafy ny vavahady,\nAmpandrosoy ary ilay Mpamonjy, \nTsy miova ny fitiavany.\n\n2-Andro firavoana lehibe\nRehefa tao Betania Izy,\nNanangana maty ilay feony\nRehefa tao Betania Izy,\nDia nino, toa akaiky fodiana,\nRehefa tao Betania Izy,\nHeni-boninahitra izay Azy\nRehefa tao Betania Izy."}, {"title": "825 - MITSANGANA IANAO RY TANORA", "lyrics": "1-Mitsangàna ianao ry tanoran'i Kristy \nDerao Izy, ilay sorona nataony\nVoaloany ny vidiny, ho fiainana mandrakizay,\nHo an'ny voavonjy.\n\n2-Mitsangàna ianao ry tanoran'ny Tompo\nMahereza amin'ny tenin'i Kristy \nKatsaho ny herin'ny Fanahy, vavaka sy finoana\nDia torio ilay hafany.\n\n3-Avia ry tanora o! Izy no ilay Sakaiza \nMitonia, mitondra fanantenana \nRaha tojo mpanota ianao, torio :\n\"Mankanesa Aminy...\" \nFitsaharana Izy.\n\n4-Ianareo tanora, izay ao amin'i Kristy,\nMivondrona mba ho iray ao Aminy\nMbamin'ny ao an-danitra izay ilay vavaka nataony,\nHiara-midera Azy."}, {"title": "826 - HOVOHAKO VE NY TOMPO", "lyrics": "1-Indro mandondona Kristy,\nHovohako ve ?\nMiandry am-paharetana Izy,\nMoa mba ekeko ve ?\nMangatsiaka loatra ny fo\nSady mbola mirehareha,\nMiangavy Izy : \"He! Mitodiha\" \nKa hovohako ve ?\n\n2-Hanao teny maly ve aho,\nHamaly ny antso ?\nHo mora fo amin'ny Tompo,\nKa moa mba ekeko ?\nHizara fitiavana Izy,\nVonona hamela ny heloko.\nMbola sahy hiamboho Azy aho\nSa mba hampandroso ?\n\n3-Dia hovohako ny foko\nMba hidirany\nHanaiky am-pifaliana aho\nNy handrosoany,\n\"Ho Mpamonjiko Ianao\nKa ho sambatra ny foko,\nHo velombelona ao Aminao,...\nMandrosoa ry Tompo\"."}, {"title": "827 - MIJANÒNA EO AM-BAVAN'ADY", "lyrics": "1-Raha mpiantafika mahery fo ianao,\nTohizo ny ady,\nNa mandresy aaaza ianao rahalahy\nTohizo ny ady,\nEo ambavan'ady lozaa mitatao,\nTsy fatiantoka ny maty an'ady\nNy kanosa no diso anjara any,\nTohizo ny ady.\n\nIsan'andininy :\n\nMazotoa miady, atreho ny ady,\nNy devoly izay mihantsy,\nKoa mijoroa dia torio Kristy,\nTohizo ny ady.\n\n2-Mila mpanao vy very aina Izy.\nTohizo ny ady,\nAza milefa fa enjeho ireo rafy,\nTohizo ny ady,\nRaha misatro-boninahitra ianao,\nEnto ny hazogikaliana ety,\nHovaliana ireo asantsika tety,\nTohizo ny ady.\n\n3-Hiravoravo isika ao an-dapa \nFa tapitra ny ady,\nNoho ilay antson' Andriamanitra,\nIzay fitaomana fanahy,\nHafaliana ny hahita azy ireo,\nDia izay voataona ho an'ny Tompo,\nHihoby, hihiaka mafy fa tonga soa,\nFaaly ka nandroso."}, {"title": "828 - VAHINY SY MPIVAHINY", "lyrics": "1-Vahiny sy mpivahiny aho\nKa tsy misy fonenako ety,\nMikatsaka ilay tanàna soa aho,\nNy Tompo no fahazavana ao,\nFa matetika no trotraka aho,\nEto aho tsy tompon'ny tany,\nTsy mpivahiny aho any,\n\nIsan'andininy : \n\nVahiny sy mpivahiny aho eto,\nVesaran'ady sy sento\nFaly ny foko hidera hatrany,\nTsy mpivahiny aho any.\n\n2-Vahiny sy mpivahiny aho,\nEto ny voahary efa lao,\nToa matroka izay mamiratra ao,\nZava-tsao manintona no ao,\nMibanjina ary ny foko, \nTanàna tsy mikoro,\nIlay tanàna efa-joro,\nTsy mpivahiny aho any.\n\n3-Vahiny sy mpivahiny aho,\nManaiyra ery ny hira eto,\nNy any anefa manintona ahy,\nFa kanto indrindra amiko,\nIreo namako tonga nialoha,\nHiaraka ao an-dapa soa,\nEto aho tsy tompon-tany,\nTsy mpivahiny aho any."}, {"title": "829 - FAINGÀNA, RY MPANJAKA", "lyrics": "1-Faingàna ry Mpanjaka \nHandray ny lovanao,\nFaingàna re mba haka\nNy tany ho Anao!\nAvia hampifaly \nNy malahelo fo,\nAfaho ny mijaly,\nSy azon'ny manjo!\n\n2-Avia faa misento\nAty ny olonao!\nNy fanjakana ento \nFa Tompo Hianao!\nTsy hisy hitomany\nEo anatrehanao,\nHiadana ny tany\nIzay alehanao!\n\n3-Ny tendrombohitra avo,\nNy lohasaha koa\nHo tonga ravoravo\nSy tretrika avokoa!\nNy be tsy haka an-kery,\nNy kely afa-po;\nTsy hisy izay ho very,\nTsy hisy izay hanjo! \n\n4-Mpanjaka sy Mpiaro\nMahery Hianao;\nNy firenena maro\nHitoky Aminao,\nHo avy lalandava\nIzao rehetra izao,\nHitondra harem-bevava\nHo eo an-tongotrao.\n\n5-Faingàna ry Mpamonjy,\nRy Tompo be fitia,\nNy olonao tra-bonjy\nMiantso hoe: Avia!\nAnao ny fiderana, \nAnao ny laza be,\nAnao ny fanjakana \nSy arahaba e!"}, {"title": "830 - RAHA MAHARITRA NY FANILO MIREHITRA", "lyrics": ":;:Raha mbola maharitra\nNy fanilo mirehitra\nDia mahazo miverina \nNy mpanota mahantra:;:"}];
const songList=document.getElementById('songList'), search=document.getElementById('search');
const browse=document.getElementById('browse'), reader=document.getElementById('reader');
const songTitle=document.getElementById('songTitle'), lyrics=document.getElementById('lyrics');
const allTab=document.getElementById('allTab'), favTab=document.getElementById('favTab');
let favorites=[];
try{favorites=JSON.parse(localStorage.getItem('fihirana_favorites')||'[]')}catch(e){favorites=[]}
let favoritesOnly=false,currentIndex=-1;
function saveFavorites(){try{localStorage.setItem('fihirana_favorites',JSON.stringify(favorites))}catch(e){}}
function renderList(){
 songList.innerHTML='';
 const q=search.value.trim().toLocaleLowerCase();
 const filtered=CHANTS.map((song,index)=>({song,index})).filter(item=>
  (item.song.title+' '+item.song.lyrics).toLocaleLowerCase().includes(q)&&
  (!favoritesOnly||favorites.includes(item.index)));
 if(!filtered.length){songList.innerHTML='<div class="empty">Tsy nahitana hira. Tsy misy hira hita.</div>';return}
 filtered.forEach(item=>{
  const row=document.createElement('div');row.className='song';
  const open=document.createElement('button');open.className='open-song';open.textContent=item.song.title;
  open.addEventListener('click',()=>openSong(item.index));
  const fav=document.createElement('button');fav.className='fav';
  fav.textContent=favorites.includes(item.index)?'★':'☆';
  fav.setAttribute('aria-label','Ajouter ou retirer des favoris');
  fav.addEventListener('click',()=>toggleFavorite(item.index));
  row.append(open,fav);songList.appendChild(row);
 });
}
function openSong(index){
 currentIndex=index;songTitle.textContent=CHANTS[index].title;lyrics.textContent=CHANTS[index].lyrics;
 updateReaderFavorite();browse.style.display='none';reader.style.display='block';window.scrollTo(0,0);
}
function closeSong(){reader.style.display='none';browse.style.display='block';renderList()}
function toggleFavorite(index){
 if(favorites.includes(index))favorites=favorites.filter(i=>i!==index);else favorites.push(index);
 saveFavorites();renderList();updateReaderFavorite();
}
function updateReaderFavorite(){
 if(currentIndex<0)return;
 document.getElementById('readerFav').textContent=favorites.includes(currentIndex)?'★ Hira tiako':'♡ Hira tiako';
}
allTab.addEventListener('click',()=>{favoritesOnly=false;allTab.classList.add('active');favTab.classList.remove('active');renderList()});
favTab.addEventListener('click',()=>{favoritesOnly=true;favTab.classList.add('active');allTab.classList.remove('active');renderList()});
search.addEventListener('input',renderList);
document.getElementById('back').addEventListener('click',closeSong);
document.getElementById('readerFav').addEventListener('click',()=>{if(currentIndex>=0)toggleFavorite(currentIndex)});
renderList();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./service-worker.js")
      .catch(function (error) { console.log("Service worker :", error); });
  });
}
</script>
